<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>View Prototype</title>
  <link rel="stylesheet" href="https://client-version.cf.emarsys.net/ui/latest/css/app.css">
</head>
<body>
<div class="e-layout e-layout-without_navigation">
  <header class="e-layout__header e-layout__header-form">
    <h1 class="e-layout__title">View Prototype</h1>
  </header>
  <main class="e-layout__content e-layout__content-form">
    <section class="e-layout__section e-padding-l">
      <h2>Enter your email to continue</h2>
      <form method="POST" action="/p/{{shareToken}}/enter">
        <div class="e-field">
          <label class="e-field__label" for="email">Email address</label>
          <input class="e-input" id="email" name="email" type="email"
            placeholder="you@company.com" required>
        </div>
        <button type="submit" class="e-btn e-btn-highlight" style="margin-top:16px;">
          Continue
        </button>
      </form>
    </section>
  </main>
</div>
<script src="https://client-version.cf.emarsys.net/ui/latest/js/app.js"></script>
</body>
</html>

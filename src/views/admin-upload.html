<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Upload Prototype — Admin</title>
  <link rel="stylesheet" href="https://client-version.cf.emarsys.net/ui/latest/css/app.css">
</head>
<body>
<div class="e-layout e-layout-without_navigation">
  <header class="e-layout__header e-layout__header-form">
    <a href="/admin/prototypes" class="e-layout__back">
      <e-layout-back-button>All Prototypes</e-layout-back-button>
    </a>
    <h1 class="e-layout__title">Upload Prototype</h1>
  </header>
  <main class="e-layout__content e-layout__content-form">
    <section class="e-layout__section e-padding-l">
      {{success}}
      <form method="POST" action="/admin/prototypes" enctype="multipart/form-data">
        <div class="e-field">
          <label class="e-field__label" for="proto-name">Name</label>
          <input class="e-input" id="proto-name" name="name" type="text"
            placeholder="Onboarding v2" required>
        </div>
        <div class="e-field" style="margin-top:12px;">
          <label class="e-field__label" for="proto-file">HTML File</label>
          <input id="proto-file" name="file" type="file" accept=".html" required>
        </div>
        <div class="e-field" style="margin-top:12px;">
          <label class="e-field__label" for="proto-allowlist">Email Allowlist (one per line)</label>
          <textarea class="e-input e-input-textarea" id="proto-allowlist" name="allowlist"
            rows="4" placeholder="customer@company.com"></textarea>
        </div>
        <button type="submit" class="e-btn e-btn-highlight" style="margin-top:16px;">
          Upload &amp; Generate Link
        </button>
      </form>
    </section>
  </main>
</div>
<script src="https://client-version.cf.emarsys.net/ui/latest/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prototypes — Admin</title>
  <link rel="stylesheet" href="https://client-version.cf.emarsys.net/ui/latest/css/app.css">
</head>
<body>
<div class="e-layout e-layout-without_navigation">
  <header class="e-layout__header e-layout__header-form">
    <h1 class="e-layout__title">Prototypes</h1>
    <div class="e-layout__actions">
      <a href="/admin/upload" class="e-layout__action e-btn e-btn-highlight">Upload Prototype</a>
    </div>
  </header>
  <main class="e-layout__content">
    <section class="e-layout__section">
      <e-datagrid id="prototypes-grid" page-size="20">
        <e-datagrid-column head="Name" content-key="name" sortable></e-datagrid-column>
        <e-datagrid-column head="Allowlist" content-key="allowlist_count"></e-datagrid-column>
        <e-datagrid-column head="Views" content-key="view_count"></e-datagrid-column>
        <e-datagrid-column head="Comments" content-key="comment_count"></e-datagrid-column>
        <e-datagrid-column head="Created" content-key="created_at" sortable></e-datagrid-column>
        <e-datagrid-item-action name="view" label="View Comments"></e-datagrid-item-action>
        <e-datagrid-item-action name="copy" label="Copy Share Link"></e-datagrid-item-action>
        <e-datagrid-item-action name="delete" label="Delete"></e-datagrid-item-action>
      </e-datagrid>
    </section>
  </main>
</div>
<script src="https://client-version.cf.emarsys.net/ui/latest/js/app.js"></script>
<script>
  const grid = document.getElementById('prototypes-grid');
  grid.data = {{prototypesJson}};
  grid.addEventListener('datagrid.item-action.view', e => {
    location.href = `/admin/prototypes/${e.detail.data.id}`;
  });
  grid.addEventListener('datagrid.item-action.copy', e => {
    navigator.clipboard.writeText(`${location.origin}/p/${e.detail.data.share_token}`);
  });
  grid.addEventListener('datagrid.item-action.delete', async e => {
    if (!confirm(`Delete "${e.detail.data.name}"?`)) return;
    await fetch(`/admin/prototypes/${e.detail.data.id}`, { method: 'DELETE' });
    location.reload();
  });
</script>
</body>
</html>

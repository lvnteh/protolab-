<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:hsl(220,14%,96%)}
  /* The prototype renders inside this iframe. It is pinned below the ProtoLab
     toolbar and to the left of the sidebar, so the sidebar is a hard viewport
     boundary the prototype content can never overlap — including the prototype's
     own position:fixed elements, which are clipped to the iframe's own viewport. */
  #__fb-proto-frame{
    position:fixed; top:0; left:0; border:0;
    width:100vw; height:100vh; display:block; background:#fff;
    transition:width .2s ease, top .2s ease, height .2s ease;
  }
</style>
</head>
<body>
<!-- The uploaded prototype is UNTRUSTED. It runs with an opaque origin via the
     sandbox: allow-scripts lets its own JS run (prototypes need it), but the
     DELIBERATE omission of allow-same-origin means it cannot reach the ProtoLab
     app origin — no document.cookie, no same-origin fetch of authenticated
     endpoints, no reading the parent shell's DOM. allow-forms keeps in-prototype
     form UX working; top navigation is NOT allowed (no allow-top-navigation), so
     the prototype can never break out of the frame. The matching
     `Content-Security-Policy: sandbox allow-scripts` header on /raw governs the
     raw URL when opened directly and all of its descendants. -->
<iframe id="__fb-proto-frame" src="{{rawSrc}}" title="Prototype"
        sandbox="allow-scripts allow-forms"></iframe>
{{sdkTag}}
</body>
</html>

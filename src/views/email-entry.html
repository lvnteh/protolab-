<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>View Prototype — Engagement Cloud ProtoLab (Beta!)</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:hsl(222,47%,11%);background:hsl(220,14%,96%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;border:1px solid hsl(220,13%,91%);padding:36px 40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.logo{font-size:22px;font-weight:800;color:hsl(252,83%,57%);margin-bottom:6px;letter-spacing:-.5px}
.subtitle{font-size:13px;color:hsl(220,9%,46%);margin-bottom:28px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:600;color:hsl(222,47%,20%);margin-bottom:7px}
.input{width:100%;padding:9px 12px;border:1px solid hsl(220,13%,87%);border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:hsl(222,47%,11%)}
.input:focus{border-color:hsl(252,83%,57%);box-shadow:0 0 0 3px hsl(252,83%,90%)}
.btn{width:100%;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:hsl(252,83%,57%);color:#fff;margin-top:4px}
.btn:hover{background:hsl(252,83%,48%)}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;background:#fdf2f2;color:#c0392b;border:1px solid #f5c0c0}
</style>
</head>
<body>
<div class="card">
  <div class="logo" style="display:flex;align-items:center;gap:8px">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M13.13 22.19L11.5 18.36C13.07 17.78 14.54 17 15.9 16.09L13.13 22.19M5.64 12.5L1.81 10.87L7.91 8.1C7 9.46 6.22 10.93 5.64 12.5M21.61 2.39C21.61 2.39 16.66 .269 11 5.93C8.81 8.12 7.5 10.53 6.65 12.64C6.37 13.39 6.56 14.21 7.11 14.77L9.24 16.89C9.79 17.45 10.61 17.63 11.36 17.35C13.5 16.53 15.88 15.19 18.07 13C23.73 7.34 21.61 2.39 21.61 2.39M14.54 9.46C13.76 8.68 13.76 7.41 14.54 6.63S16.59 5.85 17.37 6.63C18.14 7.41 18.15 8.68 17.37 9.46C16.59 10.24 15.32 10.24 14.54 9.46M8.88 16.53L7.47 15.12L8.88 16.53M6.24 22L9.88 18.36C9.54 18.27 9.21 18.12 8.91 17.91L4.83 22H6.24M2 22H3.41L8.18 17.24L6.76 15.83L2 20.59V22M2 19.17L6.09 15.09C5.88 14.79 5.73 14.46 5.64 14.12L2 17.76V19.17Z"/></svg>
    Engagement Cloud ProtoLab (Beta!)
  </div>
  <div class="subtitle">Enter your email to view this prototype</div>
  {{error}}
  <form method="POST" action="/p/{{shareToken}}/enter" novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <input class="input" id="email" name="email" type="email" placeholder="you@company.com" autofocus>
    </div>
    <button type="submit" class="btn">Continue</button>
  </form>
</div>
</body>
</html>

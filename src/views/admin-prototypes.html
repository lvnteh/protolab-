<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototypes — Engagement Cloud ProtoLab (Beta!)</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:hsl(222,47%,11%);background:hsl(220,14%,96%);min-height:100vh}
a{color:hsl(252,83%,57%);text-decoration:none}
.topbar{background:hsl(252,83%,57%);height:52px;display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.topbar__title{font-weight:700;font-size:16px;letter-spacing:-.3px;color:#fff}
.page{max-width:1100px;margin:0 auto;padding:32px 24px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.btn-primary{background:hsl(252,83%,57%);color:#fff}.btn-primary:hover{background:hsl(252,83%,48%)}
.btn-secondary{background:#fff;color:hsl(222,47%,11%);border:1px solid hsl(220,13%,87%)}.btn-secondary:hover{background:hsl(252,83%,96%)}
.btn-danger{background:none;color:#c0392b;border:1px solid #e0c0bd;padding:5px 10px;font-size:12px;border-radius:8px}.btn-danger:hover{background:#fdf2f2}
.card{background:#fff;border-radius:12px;border:1px solid hsl(220,13%,91%);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:hsl(220,9%,46%);text-transform:uppercase;letter-spacing:.5px;padding:10px 16px;border-bottom:2px solid hsl(220,13%,91%);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid hsl(220,14%,96%);vertical-align:middle;font-size:13px}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:hsl(252,83%,98%)}
.tbl--clickable tbody tr{cursor:pointer}
.tbl-wrap{overflow-x:auto}
.tbl-empty{text-align:center;padding:56px;color:hsl(220,9%,46%)}
.num{font-weight:600;color:hsl(222,47%,11%)}
.actions-cell{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.ts{color:hsl(220,9%,46%);font-size:12px}
.empty-state{text-align:center;padding:80px 24px;color:hsl(220,9%,46%)}
.empty-state svg{width:48px;height:48px;margin:0 auto 16px;display:block;color:hsl(220,13%,80%)}
.empty-state h3{font-size:16px;color:hsl(222,47%,20%);margin-bottom:8px}
.empty-state p{font-size:13px}
.copy-btn{background:none;border:1px solid hsl(220,13%,87%);cursor:pointer;color:hsl(252,83%,57%);font-size:12px;padding:5px 10px;border-radius:6px;font-weight:600}.copy-btn:hover{background:hsl(252,83%,95%)}
.proto-name{font-weight:600;color:hsl(222,47%,11%)}
.proto-name:hover{color:hsl(252,83%,57%)}

/* Upload panel */
.panel-backdrop{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:200;opacity:0;transition:opacity .2s;display:none}
.panel-backdrop.open{opacity:1}
.panel{position:fixed;top:0;right:0;height:100%;width:460px;max-width:100vw;background:#fff;box-shadow:-8px 0 40px rgba(0,0,0,.14);transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);z-index:201;display:flex;flex-direction:column}
.panel-backdrop.open .panel{transform:none}
.panel__head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid hsl(220,13%,91%)}
.panel__title{font-size:16px;font-weight:700;letter-spacing:-.2px}
.panel__close{background:none;border:none;cursor:pointer;color:hsl(220,9%,46%);padding:6px;border-radius:6px;display:flex}
.panel__close:hover{background:hsl(220,14%,96%);color:hsl(222,47%,11%)}
.panel__body{flex:1;overflow-y:auto;padding:24px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:600;color:hsl(222,47%,20%);margin-bottom:7px}
.field label .hint{font-weight:400;color:hsl(220,9%,46%)}
.input{width:100%;padding:9px 12px;border:1px solid hsl(220,13%,87%);border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:hsl(222,47%,11%)}
.input:focus{border-color:hsl(252,83%,57%);box-shadow:0 0 0 3px hsl(252,83%,90%)}
textarea.input{resize:vertical;line-height:1.5}
.file-zone{border:2px dashed hsl(220,13%,85%);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.file-zone:hover,.file-zone.drag{border-color:hsl(252,83%,57%);background:hsl(252,83%,97%)}
.file-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.file-zone svg{width:32px;height:32px;color:hsl(220,9%,60%);margin:0 auto 10px;display:block}
.file-zone__label{font-size:13px;color:hsl(220,9%,46%);line-height:1.6}
.file-zone__label strong{color:hsl(252,83%,57%)}
.file-zone__name{margin-top:10px;font-size:13px;font-weight:600;color:hsl(252,83%,57%);display:none}
.panel__foot{padding:16px 24px;border-top:1px solid hsl(220,13%,91%);display:flex;gap:10px;align-items:center}
.btn-full{flex:1;justify-content:center;padding:10px}
.upload-success{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;background:#e6f9f0;color:#1a7f4b;border:1px solid #b3e8cf;display:none}
.upload-success a{color:#1a7f4b;font-weight:600}
.upload-error{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;background:#fff0f0;color:#c0392b;border:1px solid #f8c8c8;display:none}

/* Confirm modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;display:none}
.modal-backdrop.open{opacity:1}
.modal{background:#fff;border-radius:16px;padding:28px 28px 24px;width:400px;max-width:calc(100vw - 32px);box-shadow:0 8px 40px rgba(0,0,0,.18);transform:translateY(8px) scale(.98);transition:transform .15s,opacity .15s;opacity:0}
.modal-backdrop.open .modal{transform:none;opacity:1}
.modal__icon{width:40px;height:40px;border-radius:50%;background:hsl(0,84%,95%);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.modal__icon svg{width:20px;height:20px;color:hsl(0,84%,50%)}
.modal h3{font-size:16px;font-weight:700;color:hsl(222,47%,11%);margin-bottom:8px}
.modal p{font-size:13px;color:hsl(220,9%,46%);line-height:1.6;margin-bottom:22px}
.modal__actions{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar__title" style="display:flex;align-items:center;gap:8px">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="flex-shrink:0"><path d="M13.13 22.19L11.5 18.36C13.07 17.78 14.54 17 15.9 16.09L13.13 22.19M5.64 12.5L1.81 10.87L7.91 8.1C7 9.46 6.22 10.93 5.64 12.5M21.61 2.39C21.61 2.39 16.66 .269 11 5.93C8.81 8.12 7.5 10.53 6.65 12.64C6.37 13.39 6.56 14.21 7.11 14.77L9.24 16.89C9.79 17.45 10.61 17.63 11.36 17.35C13.5 16.53 15.88 15.19 18.07 13C23.73 7.34 21.61 2.39 21.61 2.39M14.54 9.46C13.76 8.68 13.76 7.41 14.54 6.63S16.59 5.85 17.37 6.63C18.14 7.41 18.15 8.68 17.37 9.46C16.59 10.24 15.32 10.24 14.54 9.46M8.88 16.53L7.47 15.12L8.88 16.53M6.24 22L9.88 18.36C9.54 18.27 9.21 18.12 8.91 17.91L4.83 22H6.24M2 22H3.41L8.18 17.24L6.76 15.83L2 20.59V22M2 19.17L6.09 15.09C5.88 14.79 5.73 14.46 5.64 14.12L2 17.76V19.17Z"/></svg>
    Engagement Cloud ProtoLab (Beta!)
  </span>
</div>

<!-- Upload panel -->
<div class="panel-backdrop" id="panel-backdrop" onclick="if(event.target===this)closePanel()">
  <div class="panel">
    <div class="panel__head">
      <span class="panel__title">Upload Prototype</span>
      <button class="panel__close" onclick="closePanel()" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/></svg>
      </button>
    </div>
    <div class="panel__body">
      <div class="upload-success" id="upload-success"></div>
      <div class="upload-error" id="upload-error"></div>
      <div class="field">
        <label for="proto-name">Name</label>
        <input class="input" id="proto-name" name="name" type="text" placeholder="e.g. Onboarding v2">
      </div>
      <div class="field">
        <label>HTML File</label>
        <div class="file-zone" id="file-zone">
          <input type="file" name="file" id="proto-file" accept=".html">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          <div class="file-zone__label" id="file-zone-label"><strong>Click to browse</strong> or drag &amp; drop<br><span style="color:hsl(220,9%,60%);font-size:12px">.html files only</span></div>
          <div class="file-zone__name" id="file-name"></div>
        </div>
      </div>
      <div class="field">
        <label for="proto-allowlist">Email Allowlist <span class="hint">(one per line)</span></label>
        <textarea class="input" id="proto-allowlist" rows="5" placeholder="customer@company.com&#10;another@example.com"></textarea>
      </div>
    </div>
    <div class="panel__foot">
      <button class="btn btn-primary btn-full" id="submit-btn" onclick="submitUpload()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path d="M10 3a1 1 0 01.707.293l4 4a1 1 0 01-1.414 1.414L11 6.414V13a1 1 0 11-2 0V6.414L6.707 8.707a1 1 0 01-1.414-1.414l4-4A1 1 0 0110 3z"/><path d="M3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
        Upload &amp; Generate Link
      </button>
      <button class="btn btn-secondary" onclick="closePanel()">Cancel</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-backdrop" id="confirm-modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal__icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
    </div>
    <h3 id="modal-title">Delete prototype?</h3>
    <p id="modal-body"></p>
    <div class="modal__actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" id="modal-confirm" style="background:hsl(0,84%,50%);color:#fff">Delete</button>
    </div>
  </div>
</div>

<div class="page">
  <div class="page-head">
    <h1 class="page-title">Prototypes</h1>
    <button class="btn btn-primary" onclick="openPanel()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path d="M10 3a1 1 0 01.707.293l4 4a1 1 0 01-1.414 1.414L11 6.414V13a1 1 0 11-2 0V6.414L6.707 8.707a1 1 0 01-1.414-1.414l4-4A1 1 0 0110 3z"/><path d="M3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
      Upload Prototype
    </button>
  </div>
  <div class="card">
    <div class="tbl-wrap">
      <table class="tbl tbl--clickable" id="tbl">
        <thead>
          <tr>
            <th>Name</th>
            <th>Allowlist</th>
            <th>Views</th>
            <th>Comments</th>
            <th>Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" class="tbl-empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const rows = {{prototypesJson}};

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="6">
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <h3>No prototypes yet</h3>
        <p>Upload your first prototype to get started.</p>
      </div>
    </td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr onclick="location.href='/admin/prototypes/${r.id}'" style="cursor:pointer">
      <td><span class="proto-name">${esc(r.name)}</span></td>
      <td><span class="num">${r.allowlist_count}</span></td>
      <td><span class="num">${r.view_count}</span></td>
      <td><span class="num">${r.comment_count}</span></td>
      <td><span class="ts">${fmtDate(r.created_at)}</span></td>
      <td>
        <div class="actions-cell">
          <a class="copy-btn" href="/p/${esc(r.share_token)}" target="_blank" onclick="event.stopPropagation()">Open</a>
          <button class="copy-btn" onclick="event.stopPropagation();copyLink('${esc(r.share_token)}')" title="Copy share link">Copy link</button>
          <button class="btn btn-danger" onclick="event.stopPropagation();del('${r.id}','${esc(r.name)}')">Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function copyLink(token) {
  navigator.clipboard.writeText(location.origin + '/p/' + token);
  const btn = event.target;
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy link', 1800);
}

// Upload panel
function openPanel() {
  const el = document.getElementById('panel-backdrop');
  el.style.display = 'flex';
  requestAnimationFrame(() => el.classList.add('open'));
  document.getElementById('proto-name').focus();
}

function closePanel() {
  const el = document.getElementById('panel-backdrop');
  el.classList.remove('open');
  el.addEventListener('transitionend', () => { el.style.display = 'none'; }, { once: true });
}

document.getElementById('proto-file').addEventListener('change', function() {
  const fn = document.getElementById('file-name');
  const lbl = document.getElementById('file-zone-label');
  if (this.files[0]) {
    fn.textContent = this.files[0].name;
    fn.style.display = 'block';
    lbl.style.display = 'none';
  } else {
    fn.style.display = 'none';
    lbl.style.display = '';
  }
});

const fileZone = document.getElementById('file-zone');
fileZone.addEventListener('dragover', e => { e.preventDefault(); fileZone.classList.add('drag'); });
fileZone.addEventListener('dragleave', () => fileZone.classList.remove('drag'));
fileZone.addEventListener('drop', e => { e.preventDefault(); fileZone.classList.remove('drag'); });

async function submitUpload() {
  const name = document.getElementById('proto-name').value.trim();
  const file = document.getElementById('proto-file').files[0];
  const allowlist = document.getElementById('proto-allowlist').value;
  const successEl = document.getElementById('upload-success');
  const errorEl = document.getElementById('upload-error');
  const btn = document.getElementById('submit-btn');

  successEl.style.display = 'none';
  errorEl.style.display = 'none';

  if (!file) { errorEl.textContent = 'Please select an HTML file.'; errorEl.style.display = 'block'; return; }
  if (!name) { errorEl.textContent = 'Please enter a name.'; errorEl.style.display = 'block'; return; }

  const fd = new FormData();
  fd.append('name', name);
  fd.append('file', file);
  fd.append('allowlist', allowlist);

  btn.disabled = true;
  btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z"/></svg> Uploading…';

  try {
    const resp = await fetch('/admin/prototypes', { method: 'POST', headers: { Accept: 'application/json' }, body: fd });
    if (!resp.ok) throw new Error('Upload failed');
    const { name: protoName, shareLink, id } = await resp.json();

    // Reset form
    document.getElementById('proto-name').value = '';
    document.getElementById('proto-file').value = '';
    document.getElementById('proto-allowlist').value = '';
    document.getElementById('file-name').style.display = 'none';
    document.getElementById('file-zone-label').style.display = '';

    successEl.innerHTML = `<strong>${esc(protoName)}</strong> uploaded. Share link: <a href="${shareLink}" target="_blank">${shareLink}</a> — <a href="/admin/prototypes/${id}">Open</a>`;
    successEl.style.display = 'block';

    // Add row to table without reload
    rows.unshift({ id, name: protoName, share_token: shareLink.split('/p/')[1], created_at: new Date().toISOString(), allowlist_count: 0, view_count: 0, comment_count: 0 });
    render();
  } catch {
    errorEl.textContent = 'Upload failed. Please try again.';
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path d="M10 3a1 1 0 01.707.293l4 4a1 1 0 01-1.414 1.414L11 6.414V13a1 1 0 11-2 0V6.414L6.707 8.707a1 1 0 01-1.414-1.414l4-4A1 1 0 0110 3z"/><path d="M3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg> Upload &amp; Generate Link';
  }
}

// Delete confirm modal
let _modalCallback = null;
function del(id, name) {
  document.getElementById('modal-title').textContent = 'Delete prototype?';
  document.getElementById('modal-body').textContent = `"${name}" and all its data will be permanently deleted. This cannot be undone.`;
  _modalCallback = async () => {
    await fetch('/admin/prototypes/' + id, { method: 'DELETE' });
    location.reload();
  };
  const el = document.getElementById('confirm-modal');
  el.style.display = 'flex';
  requestAnimationFrame(() => el.classList.add('open'));
}

function closeModal() {
  const el = document.getElementById('confirm-modal');
  el.classList.remove('open');
  el.addEventListener('transitionend', () => { el.style.display = 'none'; }, { once: true });
}

document.getElementById('modal-confirm').addEventListener('click', async () => {
  closeModal();
  if (_modalCallback) await _modalCallback();
  _modalCallback = null;
});

render();
</script>
</body>
</html>

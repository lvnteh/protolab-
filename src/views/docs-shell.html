<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docs — ProtoLab (Beta!)</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:hsl(222,47%,11%); --muted:hsl(220,9%,46%); --line:hsl(220,13%,91%);
  --bg:hsl(220,14%,96%); --brand:hsl(252,83%,57%); --brand-50:hsl(252,83%,97%);
  --brand-100:hsl(252,83%,93%);
}
html,body{height:100%}

/* loading progress bar (full-page nav to a GitHub-backed doc takes a beat) */
.docs-loading{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;overflow:hidden;display:none;pointer-events:none}
.docs-loading.is-on{display:block}
.docs-loading__bar{position:absolute;top:0;height:100%;width:35%;background:var(--brand);border-radius:0 3px 3px 0;animation:docsload 1s ease-in-out infinite}
@keyframes docsload{0%{left:-35%}60%{left:72%}100%{left:105%}}
body.docs-busy{cursor:progress}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}

/* top bar */
.docs-top{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:9px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.docs-top__logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
.docs-top__logo svg{color:var(--brand)}
.docs-top__beta{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-100);padding:2px 7px;border-radius:999px}
.docs-top__path{margin-left:14px;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs-top__repo{margin-left:auto;display:flex;align-items:center;gap:6px}
.docs-top__repo select{font:inherit;font-size:12px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff;max-width:200px}
.docs-top__ver select{font:inherit;font-size:12px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff}
.docs-top__add{font:inherit;font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-100);border:1px solid hsl(252,83%,80%);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.docs-top__add:hover{background:var(--brand);color:#fff}
/* home repo list */
.docs-repo-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.docs-repo-item__link{color:var(--brand);font-weight:600;font-size:14px;text-decoration:none}
.docs-repo-item__link:hover{text-decoration:underline}
.docs-repo-item__del{font-size:12px;color:hsl(0,70%,55%);padding:4px 10px}

/* layout */
.docs{display:grid;grid-template-columns:var(--tree-w,280px) 1fr 340px;height:calc(100vh - 52px)}
.docs__tree{position:relative;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.docs__doc{overflow:auto;padding:28px 24px 120px}
.docs__side{background:#fff;border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}

/* left-pane toolbar + resizer */
.docs-tools{flex:0 0 auto;padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.docs-search{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
.docs-search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.docs-sort{display:flex;gap:4px}
.docs-sort button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 3px;font:inherit;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.docs-sort button.is-active{background:var(--brand);border-color:var(--brand);color:#fff}
.docs-tree-scroll{flex:1 1 auto;overflow:auto;padding:8px}
.docs-resizer{position:absolute;top:0;right:-3px;bottom:0;width:7px;cursor:col-resize;z-index:5}
.docs-resizer::after{content:'';position:absolute;right:3px;top:0;bottom:0;width:2px;background:transparent}
.docs-resizer:hover::after{background:var(--brand)}

/* tree */
.docs-tree__group{margin:0}
.docs-tree__dir{display:flex;align-items:center;gap:6px;margin:13px 0 3px;color:var(--ink);font-weight:700;font-size:13px;letter-spacing:.01em;cursor:pointer;user-select:none}
.docs-tree__dir:hover{color:var(--brand)}
.docs-tree__dir svg{width:15px;height:15px;color:var(--brand);flex:0 0 auto}
.docs-tree__chev{display:inline-block;width:10px;text-align:center;color:var(--muted);font-size:10px;flex:0 0 auto}
.docs-tree__file{display:block;padding:5px 8px;border-radius:7px;color:hsl(222,28%,32%);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.docs-tree__file:hover{background:var(--bg);color:var(--ink)}
.docs-tree__file.is-active{background:var(--brand-50);color:var(--brand);font-weight:600;box-shadow:inset 2px 0 0 var(--brand)}
.docs-tree__hint{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.docs-tree__empty{color:var(--muted);font-size:13px;padding:16px 6px;line-height:1.5}

/* banner */
.docs__banner{background:hsl(42,96%,90%);border:1px solid hsl(42,80%,78%);color:hsl(28,65%,32%);padding:9px 13px;border-radius:9px;font-size:12.5px;margin-bottom:18px}

/* document page — mirrors markdown-shell .md-doc */
.docs__page{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);padding:48px 56px 64px;line-height:1.65;font-size:16px;transition:filter .28s ease,opacity .28s ease,transform .28s ease}
.docs__page.is-leaving{filter:blur(6px);opacity:.45;transform:scale(.995);pointer-events:none}
.docs__page h1,.docs__page h2,.docs__page h3,.docs__page h4{line-height:1.25;margin:1.6em 0 .6em;font-weight:700}
.docs__page h1{font-size:2em;margin-top:0}
.docs__page h2{font-size:1.5em;border-bottom:1px solid var(--line);padding-bottom:.2em}
.docs__page h3{font-size:1.25em}
.docs__page p{margin:0 0 1em}
.docs__page a{color:var(--brand)}
.docs__page ul,.docs__page ol{margin:0 0 1em;padding-left:1.6em}
.docs__page li{margin:.25em 0}
.docs__page blockquote{margin:0 0 1em;padding:.4em 1em;border-left:4px solid hsl(252,83%,80%);background:var(--brand-50);color:hsl(222,25%,30%)}
.docs__page code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:hsl(220,14%,93%);padding:.15em .4em;border-radius:4px}
.docs__page pre{background:hsl(222,47%,11%);color:#f8f8f2;padding:16px;border-radius:10px;overflow:auto;margin:0 0 1em}
.docs__page pre code{background:none;padding:0;color:inherit}
.docs__page table{border-collapse:collapse;width:100%;margin:0 0 1em;font-size:.95em}
.docs__page th,.docs__page td{border:1px solid hsl(220,13%,88%);padding:8px 12px;text-align:left}
.docs__page th{background:var(--bg);font-weight:600}
.docs__page img{max-width:100%;height:auto}
.docs__page hr{border:none;border-top:1px solid hsl(220,13%,88%);margin:2em 0}

/* highlights */
.docs__page mark.docs-hl{background:hsl(252,83%,91%);border-bottom:2px solid var(--brand);border-radius:2px;padding:.02em 0;cursor:pointer}
.docs-flash{animation:docsflash 1.1s ease}
@keyframes docsflash{0%,100%{box-shadow:0 0 0 0 transparent}25%{box-shadow:0 0 0 3px hsl(252,83%,80%)}}

/* floating "add comment" button */
.docs-fab{position:fixed;z-index:40;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;
  background:var(--brand);color:#fff;border:none;border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:600;
  box-shadow:0 4px 14px rgba(79,70,229,.4);cursor:pointer}
.docs-fab svg{width:14px;height:14px}

/* composer */
.docs-composer{position:fixed;z-index:41;width:320px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.18);padding:12px}
.docs-composer__quote{font-size:12px;color:var(--muted);border-left:3px solid var(--brand);padding:2px 0 2px 8px;margin-bottom:9px;max-height:48px;overflow:hidden}
.docs-composer textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;line-height:1.5}
.docs-composer textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.docs-pills{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.docs-pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.docs-pill.is-active{color:#fff}
.docs-composer__foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.docs-btn{border:none;border-radius:8px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.docs-btn--primary{background:var(--brand);color:#fff}
.docs-btn--primary:disabled{opacity:.5;cursor:default}
.docs-btn--ghost{background:transparent;color:var(--muted)}

/* sidebar */
.docs-side__head{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between}
.docs-side__count{font-size:12px;font-weight:600;color:var(--muted)}
.docs-side__list{flex:1 1 auto;overflow:auto;padding:12px}
.docs-side__empty{color:var(--muted);font-size:13px;padding:24px 6px;text-align:center;line-height:1.6}
.docs-card{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.docs-card:hover{border-color:hsl(252,83%,80%);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.docs-card__top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.docs-card__kind{font-size:10.5px;font-weight:700;color:#fff;padding:2px 8px;border-radius:999px}
.docs-card__who{font-size:12px;color:var(--muted);margin-left:auto}
.docs-card__text{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.docs-card__foot{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:11.5px}
.docs-card__foot a{color:var(--muted);text-decoration:none}
.docs-card__foot a:hover{color:var(--brand)}
.docs-card__del{margin-left:auto;background:none;border:none;color:hsl(0,70%,55%);font:inherit;font-size:11.5px;cursor:pointer}
</style>
</head>
<body>
<div id="docs-loading" class="docs-loading" aria-hidden="true"><div class="docs-loading__bar"></div></div>
<header class="docs-top">
  <span class="docs-top__logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M13.13 22.19L11.5 18.36C13.07 17.78 14.54 17 15.9 16.09L13.13 22.19M5.64 12.5L1.81 10.87L7.91 8.1C7 9.46 6.22 10.93 5.64 12.5M21.61 2.39C21.61 2.39 16.66 .269 11 5.93C8.81 8.12 7.5 10.53 6.65 12.64C6.37 13.39 6.56 14.21 7.11 14.77L9.24 16.89C9.79 17.45 10.61 17.63 11.36 17.35C13.5 16.53 15.88 15.19 18.07 13C23.73 7.34 21.61 2.39 21.61 2.39M14.54 9.46C13.76 8.68 13.76 7.41 14.54 6.63S16.59 5.85 17.37 6.63C18.14 7.41 18.15 8.68 17.37 9.46C16.59 10.24 15.32 10.24 14.54 9.46Z"/></svg>
    ProtoLab
  </span>
  <span class="docs-top__beta">Docs</span>
  <span class="docs-top__path" id="docs-top-path"></span>
  <span class="docs-top__repo">
    <select id="docs-repo" title="Switch repository"></select>
    <button id="docs-repo-add" class="docs-top__add" title="Add a GitHub repository" style="display:none">+ Add repo</button>
  </span>
  <span class="docs-top__ver" id="docs-top-ver"></span>
</header>
<div class="docs">
  <nav class="docs__tree">
    <div class="docs-tools">
      <input id="docs-search" class="docs-search" type="search" placeholder="Filter docs…" autocomplete="off">
      <div class="docs-sort" id="docs-sort">
        <button type="button" data-sort="folders" class="is-active" title="Folder hierarchy">Folders</button>
        <button type="button" data-sort="name-asc" title="Name A–Z">A–Z</button>
        <button type="button" data-sort="name-desc" title="Name Z–A">Z–A</button>
        <button type="button" data-sort="date-desc" title="Newest first">Newest</button>
        <button type="button" data-sort="date-asc" title="Oldest first">Oldest</button>
      </div>
    </div>
    <div class="docs-tree-scroll" id="docs-tree"></div>
    <div class="docs-resizer" id="docs-resizer" title="Drag to resize"></div>
  </nav>
  <main class="docs__doc"><div class="docs__page" id="docs-page">{{banner}}{{content}}</div></main>
  <aside class="docs__side">
    <div class="docs-side__head">Comments <span class="docs-side__count" id="docs-count"></span></div>
    <div class="docs-side__list" id="docs-side"></div>
  </aside>
</div>
<script id="docs-cfg" type="application/json">{{cfg}}</script>
<script src="/sdk/anchor.js"></script>
<script type="module" src="/sdk/docs.js"></script>
</body>
</html>
